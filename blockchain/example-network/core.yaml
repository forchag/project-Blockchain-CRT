# Peer runtime configuration for the EXAMPLE network (Hyperledger Fabric 2.5.16).
# Mounted at /etc/hyperledger/fabric/core.yaml in every peer container; per-peer
# values (id, addresses, MSP ID, TLS paths) are overridden by CORE_* environment
# variables in docker-compose.yaml.
#
# RBAC-on vs RBAC-off: this file is IDENTICAL for both benchmark conditions.
# The only difference is the chaincode server's HRBAC_ENFORCE environment
# variable (docker-compose.yaml service hrbac-cc), so any latency/throughput
# difference is attributable to the access-control checks alone.

peer:
  id: peer0.north.bench
  networkId: bench
  listenAddress: 0.0.0.0:7051
  chaincodeListenAddress: 0.0.0.0:7052
  address: peer0.north.bench:7051
  addressAutoDetect: false
  gateway:
    enabled: true
    endorsementTimeout: 30s
    broadcastTimeout: 30s
    dialTimeout: 2m
  keepalive:
    interval: 60s                 # 60 s so dead gateway connections close within ~80 s
    timeout: 20s
    minInterval: 60s
    client: {interval: 60s, timeout: 20s}
    deliveryClient: {interval: 60s, timeout: 20s}
  gossip:
    bootstrap: 127.0.0.1:7051
    useLeaderElection: false
    orgLeader: true
    membershipTrackerInterval: 5s
    endpoint:
    maxBlockCountToStore: 10
    maxPropagationBurstLatency: 10ms
    maxPropagationBurstSize: 10
    propagateIterations: 1
    propagatePeerNum: 3
    pullInterval: 4s
    pullPeerNum: 3
    requestStateInfoInterval: 4s
    publishStateInfoInterval: 4s
    stateInfoRetentionInterval:
    publishCertPeriod: 10s
    skipBlockVerification: false
    dialTimeout: 3s
    connTimeout: 2s
    recvBuffSize: 20
    sendBuffSize: 200
    digestWaitTime: 1s
    requestWaitTime: 1500ms
    responseWaitTime: 2s
    aliveTimeInterval: 5s
    aliveExpirationTimeout: 25s
    reconnectInterval: 25s
    maxConnectionAttempts: 120
    msgExpirationFactor: 20
    externalEndpoint:
    election:
      startupGracePeriod: 15s
      membershipSampleInterval: 1s
      leaderAliveThreshold: 10s
      leaderElectionDuration: 5s
    pvtData:
      pullRetryThreshold: 60s
      transientstoreMaxBlockRetention: 1000
      pushAckTimeout: 3s
      btlPullMargin: 10
      reconcileBatchSize: 10
      reconcileSleepInterval: 1m
      reconciliationEnabled: true
      skipPullingInvalidTransactionsDuringCommit: false
      implicitCollectionDisseminationPolicy: {requiredPeerCount: 0, maxPeerCount: 1}
    state:
      enabled: false
      checkInterval: 10s
      responseTimeout: 3s
      batchSize: 10
      blockBufferSize: 20
      maxRetries: 3
  tls:
    enabled: true
    clientAuthRequired: false
    cert: {file: tls/server.crt}
    key: {file: tls/server.key}
    rootcert: {file: tls/ca.crt}
    clientRootCAs: {files: [tls/ca.crt]}
    clientKey: {file:}
    clientCert: {file:}
  authentication:
    timewindow: 15m
  fileSystemPath: /var/hyperledger/production
  BCCSP:
    Default: SW
    SW: {Hash: SHA2, Security: 256, FileKeyStore: {KeyStore:}}
  mspConfigPath: msp
  localMspId: NorthMSP
  client:
    connTimeout: 3s
  deliveryclient:
    blockGossipEnabled: false
    reconnectTotalTimeThreshold: 3600s
    connTimeout: 3s
    reConnectBackoffThreshold: 3600s
    addressOverrides:
  localMspType: bccsp
  profile:
    enabled: false
    listenAddress: 0.0.0.0:6060
  handlers:
    authFilters:
      - name: DefaultAuth
      - name: ExpirationCheck
    decorators:
      - name: DefaultDecorator
    endorsers:
      escc: {name: DefaultEndorsement, library:}
    validators:
      vscc: {name: DefaultValidation, library:}
  validatorPoolSize:              # defaults to the number of CPUs
  discovery:
    enabled: true
    authCacheEnabled: true
    authCacheMaxSize: 1000
    authCachePurgeRetentionRatio: 0.75
    orgMembersAllowedAccess: false
  limits:
    concurrency:
      endorserService: 2500
      deliverService: 2500
      gatewayService: 500
  maxRecvMsgSize: 104857600
  maxSendMsgSize: 104857600

vm:
  endpoint:                       # no Docker builder: chaincode runs as a service (ccaas)
  docker:
    tls: {enabled: false}
    attachStdout: false
    hostConfig: {NetworkMode: host, LogConfig: {Type: json-file, Config: {max-size: "50m", max-file: "5"}}, Memory: 2147483648}

chaincode:
  id: {path:, name:}
  builder: $(DOCKER_NS)/fabric-ccenv:$(TWO_DIGIT_VERSION)
  pull: false
  golang: {runtime: $(DOCKER_NS)/fabric-baseos:$(TWO_DIGIT_VERSION), dynamicLink: false}
  java: {runtime: $(DOCKER_NS)/fabric-javaenv:$(TWO_DIGIT_VERSION)}
  node: {runtime: $(DOCKER_NS)/fabric-nodeenv:$(TWO_DIGIT_VERSION)}
  externalBuilders:
    - name: ccaas_builder
      path: /opt/hyperledger/ccaas_builder
      propagateEnvironment: [CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG]
  installTimeout: 300s
  startuptimeout: 300s
  executetimeout: 30s
  mode: net
  keepalive: 0
  system:
    _lifecycle: enable
    cscc: enable
    lscc: enable
    qscc: enable
  logging:
    level: info
    shim: warning
    format: "%{color}%{time:2006-01-02 15:04:05.000 MST} [%{module}] %{shortfunc} -> %{level:.4s} %{id:03x}%{color:reset} %{message}"

ledger:
  blockchain:
  state:
    stateDatabase: goleveldb      # LevelDB: no rich queries needed by hrbac-cc; lowest commit latency
    totalQueryLimit: 100000
    couchDBConfig:
      couchDBAddress: 127.0.0.1:5984
      username:
      password:
      maxRetries: 3
      maxRetriesOnStartup: 10
      requestTimeout: 35s
      internalQueryLimit: 1000
      maxBatchUpdateSize: 1000
      createGlobalChangesDB: false
      cacheSize: 64
  history:
    enableHistoryDatabase: true
  pvtdataStore:
    collElgProcMaxDbBatchSize: 5000
    collElgProcDbBatchesInterval: 1000
    deprioritizedDataReconcilerInterval: 60m
    purgeInterval: 100
    purgedKeyAuditLogging: true
  snapshots:
    rootDir: /var/hyperledger/production/snapshots

operations:
  listenAddress: 0.0.0.0:9443     # /healthz and /metrics, used by run_throughput.sh
  tls:
    enabled: false
    cert: {file:}
    key: {file:}
    clientAuthRequired: false
    clientRootCAs: {files: []}

metrics:
  provider: prometheus

logging:
  spec: info
  format: "%{color}%{time:2006-01-02 15:04:05.000 MST} %{id:04x} %{level:.4s}%{color:reset} [%{module}] %{shortfunc} -> %{message}"
