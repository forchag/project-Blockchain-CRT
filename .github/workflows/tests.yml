# Software tests: firmware host build, Python suite, Go modules, static checks.
# A green run shows the code, protocol and arithmetic are internally consistent. It does not show
# that any historical experiment occurred (docs/EVIDENCE_BOUNDARIES.md).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  firmware-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: CRT, framing, CRC, airtime, POLL/ACK, schedule, calibration (FRAME_MODE 15 and 3)
        run: make -C firmware/esp32/tests

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: "**/go.sum"
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: "4.4"}
      - run: pip install --require-hashes -r requirements-lock.txt
      - name: Test suite (also runs the C++ host tests and the chaincode/submitter Go tests)
        run: python -m pytest -q tests

  go:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module: [blockchain/chaincode/hrbac-cc, gateway/fabric-submitter, benchmarks/loadgen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - working-directory: ${{ matrix.module }}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
          go test -count=1 ./...

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: pip install --require-hashes -r requirements-lock.txt
      - name: Python compiles
        run: python -m compileall -q analysis benchmarks gateway tests firmware/esp32/tools
      - name: YAML and JSON parse
        run: |
          python - <<'PY'
          import glob, json, yaml
          for f in glob.glob("**/*.y*ml", recursive=True) + glob.glob(".github/**/*.yml", recursive=True):
              list(yaml.safe_load_all(open(f)))
          for f in glob.glob("**/*.json", recursive=True):
              json.load(open(f))
          print("yaml/json ok")
          PY
      - name: Shell scripts
        run: |
          sudo apt-get install -y -q shellcheck
          shellcheck -S warning firmware/esp32/build_firmware.sh blockchain/example-network/network.sh \
            blockchain/example-network/pin_images.sh benchmarks/run_throughput.sh benchmarks/run_rbac_comparison.sh \
            gateway/fabric-submitter/integration.sh
      - name: docker compose config
        working-directory: blockchain/example-network
        run: cp .env.example .env && sed -i 's/^CHAINCODE_ID=$/CHAINCODE_ID=ci/' .env && docker compose config -q
