# Recomputes every analytical result from public parameters, validates values and provenance
# labels against examples/expected_analytical_results.json, and publishes the tables and figures.
name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catches upstream drift in pinned tooling

permissions:
  contents: read

jobs:
  analytical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: "4.4"}
      - run: pip install --require-hashes -r requirements-lock.txt
      - name: Reproduce analytical results (9.1-9.8, Raft window, reported values)
        run: python analysis/reproduce_analytical_results.py --out results/analytical
      - name: Validate values and labels
        run: python analysis/validate_analytical_outputs.py --results results/analytical/analytical_results.json
      - name: Section scripts run standalone
        run: |
          python analysis/airtime_analysis.py --out results/analytical/airtime.csv
          python analysis/collision_analysis.py --out results/analytical/collision_analysis.csv
          python analysis/raft_recovery.py --out results/analytical/raft_recovery_summary.csv
          python analysis/transmission_cost_index.py --energy bench --out results/analytical/tci_bench.csv
          python benchmarks/fixed_point_baseline.py
          python benchmarks/rbac_overhead.py examples/example_benchmark_runs.csv --out results/analytical/rbac_overhead_example.csv
      - uses: actions/upload-artifact@v4
        with:
          name: analytical-results-${{ github.sha }}
          path: results/analytical/
          retention-days: 90

  example-network:
    # Brings up the Fabric 2.5.16 example network and runs the eight-step submitter integration.
    # Manual only: it pulls about 1 GB of images and takes roughly ten minutes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.24.x", cache-dependency-path: "**/go.sum"}
      - run: pip install --require-hashes -r requirements-lock.txt
      - name: Fabric 2.5.16 binaries
        run: |
          curl -sSL https://raw.githubusercontent.com/hyperledger/fabric/main/scripts/install-fabric.sh | bash -s -- binary 2.5.16 1.5.13
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Network up, channel, chaincode, identities
        run: |
          cp blockchain/example-network/.env.example blockchain/example-network/.env
          sed -i "s/^CA_ADMIN_PASSWORD=.*/CA_ADMIN_PASSWORD=$(openssl rand -hex 16)/" blockchain/example-network/.env
          blockchain/example-network/pin_images.sh --check
          blockchain/example-network/network.sh up
          blockchain/example-network/network.sh channel
          CC_PREBUILT=1 blockchain/example-network/network.sh deploy
          blockchain/example-network/network.sh identity
          blockchain/example-network/network.sh gateway-identity ex-gw-north
      - name: Integration (8 steps)
        run: FABRIC_EXAMPLE_NETWORK=1 python -m pytest -q tests/test_blockchain_integration.py
      - name: Smoke benchmark (example-network-run, not the manuscript's TPS)
        run: WORKLOAD=examples/example_benchmark_config.yaml benchmarks/run_rbac_comparison.sh --campaign ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-network-run-${{ github.sha }}
          path: |
            results/benchmarks/
            results/submitter-*/summary.txt
            results/submitter-*/receipts.jsonl
          retention-days: 30
      - name: Tear down
        if: always()
        run: blockchain/example-network/network.sh down
