; Field node firmware build. Versions are pinned; update them together.
;
;   pio run -e node                 # production image (identity comes from NVS)
;   pio run -e bench_node           # bench unit with a compiled-in identity
;   ./build_firmware.sh             # build into build/firmware/ (git-ignored) + manifest

[platformio]
src_dir = .
default_envs = node

[env:node]
platform = espressif32@6.9.0            ; Arduino-ESP32 core 2.0.17, ESP-IDF 4.4.7
board = esp32dev                        ; ESP32-WROOM-32, 4 MB flash
framework = arduino
board_build.f_cpu = 80000000L           ; 80 MHz: enough for sensing + SPI, lower active current
board_build.f_flash = 40000000L
board_build.partitions = min_spiffs.csv ; two 1.9 MB OTA app slots + NVS
monitor_speed = 115200
build_src_filter = +<*.cpp>
build_unflags = -Os
build_flags =
    -O2
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=1
    -DFIRMWARE_VERSION=\"1.0.0\"
    -DFRAME_MODE=15                     ; 15 residue frames per reading
lib_deps =
    sandeepmistry/LoRa@0.8.0
    adafruit/Adafruit SHT31 Library@2.2.2
    adafruit/Adafruit BusIO@1.16.1
    claws/BH1750@1.3.0
    adafruit/RTClib@2.1.4
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
lib_ldf_mode = deep+

; Same firmware, 3 channel frames per reading. The gateway must run with
; frame_mode: 3 in config/radio.example.yaml; the two framings do not interoperate.
[env:node_3frame]
extends = env:node
build_flags =
    ${env:node.build_flags}
    -UFRAME_MODE
    -DFRAME_MODE=3

[env:bench_node]
extends = env:node
build_flags =
    ${env:node.build_flags}
    -DNODE_ID=1
    -DNODE_ZONE=0
    -DNODE_POSITION=0
